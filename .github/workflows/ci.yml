name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, because the template's dependency ranges move even when this
  # repo doesn't. A new release of a dependency can break generated projects.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  cli:
    name: CLI - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  generated-project:
    name: Generated project - ${{ matrix.package-manager }}, Node ${{ matrix.node-version }} ${{ matrix.features }}
    runs-on: ubuntu-latest
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        package-manager: [npm, pnpm]
        features: ['--gatekeeper']
        # The project without extras must keep working as features are added.
        include:
          - node-version: 24
            package-manager: npm
            features: '--no-gatekeeper'
          - node-version: 24
            package-manager: pnpm
            features: '--no-gatekeeper'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install pnpm
        if: matrix.package-manager == 'pnpm'
        run: npm install -g pnpm@latest

      - name: Build CLI
        run: |
          npm ci
          npm run build

      - name: Set a git identity for the initial commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Scaffold a project
        run: node dist/index.js test-api --yes --package-manager ${{ matrix.package-manager }} ${{ matrix.features }}

      - name: Everything is committed, including the lockfile
        working-directory: test-api
        run: |
          git status --short
          test -z "$(git status --short)"

      - name: Typecheck, build, test, lint and format
        working-directory: test-api
        run: |
          ${{ matrix.package-manager }} run typecheck
          ${{ matrix.package-manager }} run build
          ${{ matrix.package-manager }} run test:coverage
          ${{ matrix.package-manager }} run lint
          ${{ matrix.package-manager }} run format:check

      - name: Boot the production build and check it
        working-directory: test-api
        run: |
          NODE_ENV=production TRUST_PROXY=1 node dist/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health > /dev/null && break; sleep 1; done

          curl -sf http://localhost:3000/api/health | tee health.json
          grep -q '"status":"healthy"' health.json

          # Swagger must list the routes from the compiled files.
          curl -sf http://localhost:3000/api-docs/swagger-ui-init.js | grep -q '"/api/health"'

          # Malformed JSON is the client's mistake: 400, not 500.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{bad' http://localhost:3000/api/health)
          echo "Malformed JSON status: $status"
          test "$status" = "400"

          # The health check is never rate limited.
          if curl -sI http://localhost:3000/api/health | grep -qi '^x-ratelimit-limit'; then
            echo "The health check is rate limited"; exit 1
          fi

          # Other routes have rate limit headers only when Gatekeeper was chosen.
          if [ "${{ matrix.features }}" = "--gatekeeper" ]; then
            curl -sI http://localhost:3000/api/nonexistent | grep -qi '^x-ratelimit-limit: 100'

            # Behind a proxy (TRUST_PROXY=1), each client has its own limit.
            # One client goes over it, and a second one still gets through.
            for i in $(seq 1 100); do
              curl -s -o /dev/null -H 'X-Forwarded-For: 198.51.100.1' http://localhost:3000/api/nonexistent
            done
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 198.51.100.1' http://localhost:3000/api/nonexistent)" = "429"
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 198.51.100.2' http://localhost:3000/api/nonexistent)" = "404"

            # The client that's over the limit can still reach the health check.
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 198.51.100.1' http://localhost:3000/api/health)" = "200"
          elif curl -sI http://localhost:3000/api/nonexistent | grep -qi '^x-ratelimit-limit'; then
            echo "Rate limit headers without Gatekeeper"; exit 1
          fi

  docker:
    name: Docker image - ${{ matrix.package-manager }}
    runs-on: ubuntu-latest
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install pnpm
        if: matrix.package-manager == 'pnpm'
        run: npm install -g pnpm@latest

      - name: Build CLI and scaffold a project
        run: |
          npm ci
          npm run build
          node dist/index.js test-api --yes --no-git --package-manager ${{ matrix.package-manager }}

      - name: Build the image
        working-directory: test-api
        run: docker build -t test-api .

      - name: Run the image and check health
        run: |
          docker run -d --name test-api -p 3000:3000 test-api
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/api/health | grep -q '"status":"healthy"'
          curl -sf http://localhost:3000/api-docs/swagger-ui-init.js | grep -q '"/api/health"'
          docker logs test-api
