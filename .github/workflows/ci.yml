name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test - scaffold a project
        run: |
          node dist/index.js test-api --skip-install --no-git
          ls -la test-api/
          cat test-api/package.json
          echo "✅ Scaffold succeeded"

  e2e-test:
    name: E2E - Boot Generated Project
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install CLI dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Scaffold project
        run: node dist/index.js test-api --no-git

      - name: Run generated project tests
        working-directory: test-api
        run: npm test

      - name: Boot generated project and verify health
        working-directory: test-api
        run: |
          npm run dev &
          SERVER_PID=$!
          sleep 5
          
          # Test health endpoint
          RESPONSE=$(curl -s http://localhost:3000/api/health)
          echo "Health response: $RESPONSE"
          
          # Check if response contains "healthy"
          echo "$RESPONSE" | grep -q "healthy" && echo "✅ Health check passed" || (echo "❌ Health check failed" && exit 1)
          
          # Cleanup
          kill $SERVER_PID
